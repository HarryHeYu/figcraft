name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -v

  smoke:
    # Wheel-build + install + real-CLI/stdio acceptance on clean machines
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Install wheel into a fresh venv
        shell: bash
        run: |
          uv venv .smoke-venv
          if [ -x .smoke-venv/bin/python ]; then
            PY=".smoke-venv/bin/python"
          else
            PY=".smoke-venv/Scripts/python.exe"
          fi
          uv pip install --python "$PY" dist/*.whl

      - name: CLI + MCP stdio smoke (installed wheel, foreign directory)
        shell: bash
        run: |
          if [ -x .smoke-venv/bin/papercanvas ]; then
            PC="$GITHUB_WORKSPACE/.smoke-venv/bin/papercanvas"
            MCP="$GITHUB_WORKSPACE/.smoke-venv/bin/papercanvas-mcp"
          else
            PC="$GITHUB_WORKSPACE/.smoke-venv/Scripts/papercanvas.exe"
            MCP="$GITHUB_WORKSPACE/.smoke-venv/Scripts/papercanvas-mcp.exe"
          fi
          SMOKE_ROOT="$PWD/.smoke-project"
          mkdir -p "$SMOKE_ROOT"
          cd "$SMOKE_ROOT"
          "$PC" init fig.json --id smoke_ci
          printf '{"operations":[{"op":"add_node","node":{"id":"a","label":"A"}},{"op":"add_node","node":{"id":"b","label":"B"}},{"op":"add_edge","edge":{"id":"e1","source":"a","target":"b"}}]}' > ops.json
          "$PC" patch fig.json --ops ops.json
          "$PC" layout fig.json --preset layered
          "$PC" lint fig.json
          "$PC" render fig.json --format all
          test -s fig.svg && test -s fig.pdf && test -s fig.pptx
          uv run --project "$GITHUB_WORKSPACE" python \
            "$GITHUB_WORKSPACE/docs/rc/stdio_smoke.py" \
            --root "$SMOKE_ROOT" \
            --executable "$GITHUB_WORKSPACE/$MCP"
