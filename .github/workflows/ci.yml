name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -v

  smoke:
    # Wheel-build + install + real-CLI/stdio acceptance on a clean machine
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Install wheel into a fresh venv
        run: |
          uv venv .smoke-venv
          uv pip install --python .smoke-venv/bin/python dist/*.whl

      - name: CLI smoke (installed wheel, foreign directory)
        run: |
          mkdir -p /tmp/smoke-project
          cd /tmp/smoke-project
          PC="$GITHUB_WORKSPACE/.smoke-venv/bin/papercanvas"
          "$PC" init fig.json --id smoke_ci
          printf '{"operations":[{"op":"add_node","node":{"id":"a","label":"A"}},{"op":"add_node","node":{"id":"b","label":"B"}},{"op":"add_edge","edge":{"id":"e1","source":"a","target":"b"}}]}' > ops.json
          "$PC" patch fig.json --ops ops.json
          "$PC" layout fig.json --preset layered
          "$PC" lint fig.json
          "$PC" render fig.json --format all
          test -s fig.svg && test -s fig.pdf && test -s fig.pptx

      - name: MCP stdio smoke (installed papercanvas-mcp)
        run: |
          uv run --project "$GITHUB_WORKSPACE" python \
            "$GITHUB_WORKSPACE/docs/rc/stdio_smoke.py" \
            --root /tmp/smoke-project \
            --executable "$GITHUB_WORKSPACE/.smoke-venv/bin/papercanvas-mcp"
