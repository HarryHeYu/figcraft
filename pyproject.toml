[project]
name = "papercanvas"
version = "0.1.0"
description = "Agent-native scientific figure studio: Figures as Code with deterministic, editable SVG/PDF/PPTX output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HarryHeYu" }]
keywords = ["figures", "diagram", "svg", "agent", "scientific", "vector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pydantic>=2.9",
    "typer>=0.16",
    "rich>=13.0",
    "lxml>=5.3",
    "pillow>=11.0",
    "reportlab>=5.1.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
papercanvas = "papercanvas.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papercanvas"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
